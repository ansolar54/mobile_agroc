InfoCondicLP1_FMX=<strong>1.</strong> Los precios indicados corresponden a cada presentaci\u00f3n de producto, no incluyen IGV y est\u00e1n expresados en d\u00f3lares de los Estados Unidos de Am\u00e9rica.<br>
InfoCondicLP2_FMX=<strong>2.</strong> Los precios son referenciales y pueden ser modificados por FARMEX sin previo aviso.<br>
InfoCondicLP3_FMX=<strong>3.</strong> Las ventas se realizan \u00fanicamente en empaque cerrado.<br>
InfoCondicLP4_FMX=<strong>4.</strong> La disponibilidad de productos est\u00e1 sujeta al stock existente o hasta agotar stock.<br>
InfoCondicLP5_FMX=<strong>5.</strong> Los precios aplican para la entrega en el almac\u00e9n de FARMEX.<br>
InfoCondicLP6_FMX=<strong>6.</strong> La mercader\u00eda viaja por cuenta y riesgo exclusivo del cliente. FARMEX no asume responsabilidad alguna por p\u00e9rdida, extrav\u00edo y/o da\u00f1o de la mercader\u00eda durante el transporte, incluso cuando el transportista no haya sido autorizado por el cliente.<br>
InfoCondicLP7_FMX=<strong>7.</strong> En caso de incumplimiento de los plazos por parte del cliente, aval o fiador, se generar\u00e1n intereses compensatorios y, moratorios, seg\u00fan las tasas establecidas por ley, y gastos administrativos relacionados a la venta.<br>

