# InfoCondicPR1=<p style="font-size: 1.05rem;"><strong>1.</strong> Las promociones aplican exclusivamente a clientes del canal de ventas Distribuci\u00f3n o Habilitadores.</p>
InfoCondicPR1=<strong>1.</strong> Las promociones aplican exclusivamente a clientes del canal de ventas Distribuci\u00f3n o Habilitadores.<br>
InfoCondicPR2=<strong>2.</strong> La vigencia de las promociones est\u00e1 limitada al periodo se\u00f1alado o hasta agotar stock de los productos involucrados, lo que suceda primero. Las promociones no son retroactivas.<br>
InfoCondicPR3=<strong>3.</strong> Las promociones aplican \u00fanicamente dentro de los territorios se\u00f1alados.<br>
InfoCondicPR4=<strong>4.</strong> Las promociones no son acumulables con otras promociones vigentes.<br>
InfoCondicPR5=<strong>5.</strong> En las promociones que incluyen productos adicionales, no se permite la consolidaci\u00f3n de pedidos; la promoci\u00f3n aplica por pedido individual.<br>
InfoCondicPR6=<strong>6.</strong> Las promociones son v\u00e1lidas por material espec\u00edfico, no por grupos de art\u00edculos.<br>
InfoCondicPR7=<strong>7.</strong> FARMEX se reserva el derecho de modificar, suspender o cancelar cualquier promoci\u00f3n en cualquier momento.<br>
InfoCondicPR8=<strong>8.</strong> FARMEX se reserva el derecho de limitar las cantidades de productos sujetos a promociones por cliente, de acuerdo con la disponibilidad del stock.<br>

